services:
  laravel-est:
    container_name: laravel-est
    restart: always
    build:
      dockerfile: backend/Dockerfile
      context: .
    user: "1000:1001"
    ports:
      - 9000:9000
    volumes:
      - .:/var/www
#      - /var/www/vendor
      - ./php/php.ini-production:/usr/local/etc/php/php.ini-production
      - ./php/upload-limit.ini:/usr/local/etc/php/conf.d/upload-limit.ini
    networks:
      - app-network

  vuejs-est:
    container_name: vuejs-est
    restart: always
    build:
      dockerfile: frontend/Dockerfile
      context: .
    ports:
      - 5170:5170
    volumes:
      - .:/vue
      - /vue/node_modules
    networks:
      - app-network

  mysql-est:
    container_name: mysql-est
    restart: always
    image: mysql:8.2
    volumes:
      - database:/var/lib/mysql
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: estate-trade
      MYSQL_ROOT_PASSWORD: root
    networks:
      - app-network

  phpmyadmin-est:
    container_name: phpmyadmin-est
    restart: always
    image: phpmyadmin/phpmyadmin:latest
    ports:
      - 8086:80
    environment:
      PMA_HOST: mysql-est
      MYSQL_ROOT_PASSWORD: root
    networks:
      - app-network

  nginx-est:
    container_name: nginx-est
    image: nginx:latest
    restart: always
    ports:
      - 8000:80
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel-est
      - vuejs-est
    networks:
      - app-network

  redis-est:
    container_name: redis-est
    image: redis:8
    ports:
      - 6379:6379
    volumes:
      - redisData:/data
    networks:
      - app-network


networks:
  app-network:
    driver: bridge

volumes:
  database: {}
  vendor: {}
  redisData: {}
