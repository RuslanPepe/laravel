services:
  laravel:
    container_name: laravel
    restart: always
    build:
      dockerfile: backend/Dockerfile
      context: .
    ports:
      - 9000:9000
    volumes:
      - .:/var/www
      - /var/www/vendor
      - ./php/php.ini-production:/usr/local/etc/php/php.ini-production
      - ./php/upload-limit.ini:/usr/local/etc/php/conf.d/upload-limit.ini
    networks:
      - app-network

  vuejs:
    container_name: vuejs
    restart: always
    build:
      dockerfile: frontend/Dockerfile
      context: .
    ports:
      - 5170:5170
    volumes:
      - .:/vue
      - /vue/node_modules
    networks:
      - app-network

  mysql:
    container_name: mysql
    restart: always
    image: mysql:8.2
    volumes:
      - database:/var/lib/mysql
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
    networks:
      - app-network

  phpmyadmin:
    container_name: phpmyadmin
    restart: always
    image: phpmyadmin/phpmyadmin:latest
    ports:
      - 8086:80
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - 8000:80
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel
      - vuejs
    networks:
      - app-network


networks:
  app-network:
    driver: bridge

volumes:
  database: {}
  vendor: {}
